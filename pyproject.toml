[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-agents-cli"
version = "1.0.1"
description = "Centralized hub to manage and distribute skills, rules, and subagents across multiple AI coding assistants"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "TheCheepeer" },
    { name = "João Sales" }
]
keywords = ["ai", "agents", "cursor", "claude", "antigravity", "copilot", "llm", "skills"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
dependencies = [
    "rich>=13.7.0",
    "questionary>=2.1.0",
]

[project.scripts]
omni-agents = "omni_agents.cli:main"
omni-agent = "omni_agents.cli:main"
omni = "omni_agents.cli:main"

[project.urls]
Homepage = "https://github.com/TheCheepeer/omni-agents"
Repository = "https://github.com/TheCheepeer/omni-agents.git"
Issues = "https://github.com/TheCheepeer/omni-agents/issues"
"João Sales (GitHub)" = "https://github.com/joao626"

[tool.setuptools.packages.find]
where = ["src"]
include = ["omni_agents*"]
exclude = ["*__pycache__*", "build*", "dist*"]
namespaces = true

[tool.setuptools.package-data]
"omni_agents" = ["languages/*.json", "languages/*.md"]


