name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    validate:
        name: Build & Validate (${{ matrix.os }} - Python ${{ matrix.python-version }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                python-version: ["3.10", "3.13"]

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install Build Tools and Package Dependencies
              run: |
                  python -m pip install --upgrade pip build setuptools wheel
                  python -m pip install -e .

            - name: Verify Code Compilation
              run: |
                  python -m compileall src

            - name: Run Unit Tests
              run: |
                  python -m unittest discover -s tests -p "test_*.py" -v

            - name: Build Source and Wheel Distributions
              run: |
                  python -m build

            - name: Inspect Wheel Artifacts
              shell: python
              run: |
                  import glob
                  import zipfile

                  wheels = glob.glob("dist/*.whl")
                  assert wheels, "No wheel distribution found in dist/"
                  with zipfile.ZipFile(wheels[0]) as z:
                      files = z.namelist()
                      print(f"Total files in wheel: {len(files)}")
                      assert any(f.startswith("omni_agents/") for f in files), "omni_agents/ missing in wheel"
                      assert any(f.endswith("cli.py") for f in files), "cli.py missing in wheel"
                      assert any("languages/en.json" in f for f in files), "languages/en.json missing in wheel"
                      assert any("languages/pt.json" in f for f in files), "languages/pt.json missing in wheel"
                      assert any("languages/es.json" in f for f in files), "languages/es.json missing in wheel"
                  print("[OK] Wheel distribution verified successfully!")
