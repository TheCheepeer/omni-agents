name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    validate:
        name: Build & Validate (${{ matrix.os }} - Python ${{ matrix.python-version }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                python-version: ["3.10", "3.13"]

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install Build Tools
              run: |
                  python -m pip install --upgrade pip build setuptools wheel

            - name: Verify Code Compilation
              run: |
                  python -m compileall scripts

            - name: Build Source and Wheel Distributions
              run: |
                  python -m build

            - name: Inspect Wheel Artifacts
              shell: python
              run: |
                  import glob
                  import zipfile

                  wheels = glob.glob("dist/*.whl")
                  assert wheels, "No wheel distribution found in dist/"
                  with zipfile.ZipFile(wheels[0]) as z:
                      files = z.namelist()
                      print(f"Total files in wheel: {len(files)}")
                      assert any(f.startswith("scripts/") for f in files), "scripts/ missing in wheel"
                      assert any(f.startswith("agents/") for f in files), "agents/ missing in wheel"
                      assert any(f.startswith("rules/") for f in files), "rules/ missing in wheel"
                      assert any(f.startswith("skills/") for f in files), "skills/ missing in wheel"
                      assert len(files) > 500, f"Expected >500 files, found {len(files)}"
                  print("[OK] Wheel distribution verified successfully!")
